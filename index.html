<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Math Defense</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #gameContainer {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      outline: none;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div id="gameContainer">
    <canvas id="c" tabindex="0"></canvas>
  </div>

  <script>
    // ── Canvas setup ──────────────────────────────────────────────
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    c.width = 960;
    c.height = 540;
    const W = c.width, H = c.height;

    // ── Layout constants ──────────────────────────────────────────
    const LANE_YS = [245, 305, 365, 440];   // 4 lanes (centered in thick bands)
    const LANE_H = 80;
    const CASTLE_X = W - 140;
    const CASTLE_W = 140;
    const SPAWN_X = -60;
    // Archer positioned on the tower on the right
    const TOWER_X = W - 105;
    const TOWER_Y = H - 210;

    // ── Asset Loading ─────────────────────────────────────────────
    const bgImg = new Image();
    bgImg.src = 'assets_refined/Background.png';

    const heroImg = new Image();
    heroImg.src = 'assets_refined/hero_1.png';

    const zImgs = [];
    for (let i = 1; i <= 5; i++) {
      const img = new Image();
      img.src = `assets_refined/Zombie_${i}.png`;
      zImgs.push(img);
    }

    const heartLifeImg = new Image();
    heartLifeImg.src = 'assets_refined/heart_life.png';
    const heartLostImg = new Image();
    heartLostImg.src = 'assets_refined/heart_life_lost.png';

    // ── Game state ────────────────────────────────────────────────
    let phase = 'START'; // START | PLAY | WAVE_CLEAR | GAMEOVER | WIN
    let wave = 1;
    const MAX_WAVES = 8;
    let score = 0;
    let hp = 5;

    let zombies = [];
    let arrows = [];
    let particles = [];
    let msgs = [];

    let spawnQueue = [];
    let spawnTimer = 0;
    const SPAWN_INTERVAL = 2200;

    let lastTs = 0;
    let waveEndTimer = 0;

    // Input & Targeting
    let currentInput = '';
    let manualTarget = null;
    let currentTarget = null;
    let archerFeedback = 0; // Timer for flashing input bubble red/green
    let archerFeedbackColor = '';

    // ── Helpers ───────────────────────────────────────────────────
    function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function makeProblem(w) {
      let ops = ['+'];
      if (w >= 2) ops.push('-');
      if (w >= 5) ops.push('×');
      const op = ops[rnd(0, ops.length - 1)];
      let a, b, ans, expr;
      if (op === '+') {
        a = rnd(1, 8 + Math.min(w, 6)); b = rnd(1, 8 + Math.min(w, 6));
        ans = a + b; expr = `${a}+${b}`;
      } else if (op === '-') {
        a = rnd(6, 15 + Math.min(w, 5)); b = rnd(1, a - 1);
        ans = a - b; expr = `${a}-${b}`;
      } else {
        a = rnd(2, 5); b = rnd(2, 6);
        ans = a * b; expr = `${a}×${b}`;
      }
      return { expr, ans };
    }

    // ── Particle & Msgs ───────────────────────────────────────────
    function spawnParticles(x, y, col) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = rnd(2, 6);
        particles.push({
          x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
          life: 1, decay: 0.03 + Math.random() * 0.02, r: rnd(4, 9), col
        });
      }
    }

    function addMsg(text, x, y, col = '#7EE787') {
      msgs.push({ text, x, y, life: 1, vy: -1.2, col });
    }

    // ── Zombie ────────────────────────────────────────────────────
    class Zombie {
      constructor(wave) {
        this.lane = rnd(0, 3); // 4 lanes
        this.x = SPAWN_X;
        this.y = LANE_YS[this.lane];
        this.typeI = rnd(0, 4); // 5 zombie types
        // Speed gradually increases with wave progression
        this.speed = 0.5 + (wave - 1) * 0.15 + Math.random() * 0.1;
        this.alive = true;
        this.dying = false;
        this.dyingTimer = 0;
        this.wobble = Math.random() * Math.PI * 2;
        const p = makeProblem(wave);
        this.expr = p.expr;
        this.ans = p.ans;
      }
      update(dt) {
        if (!this.alive) return;
        this.wobble += dt * 0.006;
        if (this.dying) {
          this.dyingTimer -= dt;
          if (this.dyingTimer <= 0) this.alive = false;
          return;
        }
        this.x += this.speed * (dt / 16);
      }
      startDying() {
        if (this.dying) return;
        this.dying = true;
        this.dyingTimer = 350;
        spawnParticles(this.x, this.y, '#FF5252');
        if (manualTarget === this) manualTarget = null;
      }
      reachedCastle() { return this.x >= CASTLE_X - 10; }
      draw(isTargeted) {
        if (!this.alive) return;
        const x = this.x, y = this.y;
        const alpha = this.dying ? Math.max(0, this.dyingTimer / 350) : 1;
        ctx.globalAlpha = alpha;

        const walk = Math.sin(this.wobble) * 4;
        const rot = Math.cos(this.wobble) * 0.06;

        // Target highlight
        if (isTargeted && !this.dying) {
          ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
          ctx.beginPath();
          ctx.ellipse(x, y + 35, 34, 14, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath(); ctx.ellipse(x, y + 35, 26, 9, 0, 0, Math.PI * 2); ctx.fill();

        // Zombie Sprite
        const img = zImgs[this.typeI];
        if (img.complete && img.width > 0) {
          const h = 140; // Taller zombies to match reference
          const w = img.width * (h / img.height);
          ctx.save();
          ctx.translate(x, y + walk);
          ctx.rotate(rot);
          // Center horizontally, position feet near y+45
          ctx.drawImage(img, -w / 2, -h + 45, w, h);
          ctx.restore();
        }

        // Speech bubble
        const bw = Math.max(56, ctx.measureText(this.expr).width + 20);
        const bh = 24, bx = x - bw / 2, by = y - 110; // Placed above the taller zombie head
        ctx.fillStyle = 'rgba(240,230,210,1)'; // Parchment look
        roundRect(bx, by, bw, bh, 5); ctx.fill();
        ctx.strokeStyle = isTargeted ? '#FF5252' : '#8D6E63';
        ctx.lineWidth = isTargeted ? 3 : 2;
        roundRect(bx, by, bw, bh, 5); ctx.stroke();
        // tail
        ctx.fillStyle = 'rgba(240,230,210,1)';
        ctx.beginPath(); ctx.moveTo(x - 5, by + bh); ctx.lineTo(x + 5, by + bh); ctx.lineTo(x, by + bh + 7); ctx.closePath(); ctx.fill();
        // text
        ctx.fillStyle = '#3E2723';
        ctx.font = 'bold 14px "Segoe UI",monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(this.expr, x, by + bh / 2);
        ctx.textBaseline = 'alphabetic';

        ctx.globalAlpha = 1;
      }
    }

    // ── Arrow ─────────────────────────────────────────────────────
    class Arrow {
      constructor(target) {
        this.sx = TOWER_X; this.sy = TOWER_Y - 20;
        this.tx = target.x; this.ty = target.y;
        this.target = target;
        this.t = 0;
        this.done = false;
        // determine arc height
        this.my = Math.min(this.sy, this.ty) - 100;
      }
      pos(t) {
        const mx = (this.sx + this.tx) / 2;
        const x = (1 - t) * (1 - t) * this.sx + 2 * (1 - t) * t * mx + t * t * this.tx;
        const y = (1 - t) * (1 - t) * this.sy + 2 * (1 - t) * t * this.my + t * t * this.ty;
        return { x, y };
      }
      update(dt) {
        if (this.done) return;
        this.t += dt * 0.0035;
        if (this.t >= 1) {
          this.t = 1; this.done = true;
          if (this.target.alive && !this.target.dying) {
            this.target.startDying();
            score += 10 + wave * 2;
          }
        }
      }
      draw() {
        if (this.done) return;
        const { x, y } = this.pos(this.t);
        const prev = this.pos(Math.max(0, this.t - 0.05));
        const angle = Math.atan2(y - prev.y, x - prev.x);
        ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
        ctx.fillStyle = '#795548'; ctx.fillRect(-16, -2, 16, 4); // shaft
        ctx.fillStyle = '#FF5252'; // red fletching
        ctx.fillRect(-16, -4, 6, 3); ctx.fillRect(-16, 1, 6, 3);
        ctx.fillStyle = '#E0E0E0'; // tip
        ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-4, -5); ctx.lineTo(-4, 5); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    // ── Wave builder ──────────────────────────────────────────────
    function buildWave(w) {
      const count = 5 + w * 3;
      spawnQueue = [];
      for (let i = 0; i < count; i++) spawnQueue.push(w);
      spawnTimer = 0;
    }

    function startWave() {
      zombies = []; arrows = []; particles = [];
      currentInput = ''; manualTarget = null; currentTarget = null;
      buildWave(wave);
      phase = 'PLAY';
    }

    // ── Background & Scenery ──────────────────────────────────────
    function drawBackground() {
      if (bgImg.complete) {
        ctx.drawImage(bgImg, 0, 0, W, H);
      } else {
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
      }
    }

    // ── Archer Extras ─────────────────────────────────────────────
    function drawCastle() {
      const ax = TOWER_X, ay = TOWER_Y;

      // Archer Sprite
      if (heroImg.complete && heroImg.width > 0) {
        const h = 180; // Size to match the towering zombies
        const w = heroImg.width * (h / heroImg.height);
        // Draw centered on X, and standing on the tower Y
        ctx.drawImage(heroImg, ax - w / 2, ay - h + 50, w, h);
      }

      // Target arc (if playing)
      if (phase === 'PLAY' && currentTarget && !currentTarget.dying) {
        ctx.strokeStyle = 'rgba(255, 82, 82, 0.7)';
        ctx.setLineDash([10, 10]);
        ctx.lineWidth = 3;
        ctx.beginPath();
        // Start arc from approximate bow position (middle-left of hero)
        ctx.moveTo(ax - 35, ay - 60);
        // Quadratic bezier to target
        const tx = currentTarget.x, ty = currentTarget.y;
        const mx = (ax - 35 + tx) / 2, my = Math.min(ay - 60, ty) - 100;
        ctx.quadraticCurveTo(mx, my, tx, ty);
        ctx.stroke();
        ctx.setLineDash([]); // reset
      }

      // Archer Answer Bubble
      const bText = currentInput === '' ? '?' : currentInput;
      ctx.font = 'bold 24px "Segoe UI"';
      const bw = Math.max(60, ctx.measureText(bText).width + 30);
      const bh = 40, bx = ax - bw / 2, by = ay - 175; // Moved higher to sit above the hero's head

      // Background logic for feedback
      ctx.fillStyle = archerFeedback > 0 ? archerFeedbackColor : '#FFE0B2';
      roundRect(bx, by, bw, bh, 8); ctx.fill();
      ctx.strokeStyle = '#E65100'; ctx.lineWidth = 3;
      roundRect(bx, by, bw, bh, 8); ctx.stroke();

      // Tail
      ctx.fillStyle = archerFeedback > 0 ? archerFeedbackColor : '#FFE0B2';
      ctx.beginPath(); ctx.moveTo(ax - 8, by + bh); ctx.lineTo(ax + 8, by + bh); ctx.lineTo(ax, by + bh + 12); ctx.closePath(); ctx.fill();

      // Text
      ctx.fillStyle = '#212121';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(bText, ax, by + bh / 2);
      ctx.textBaseline = 'alphabetic';
    }

    // ── Draw HUD ──────────────────────────────────────────────────
    function drawHUD() {
      // Hearts (PNG sprites; emoji fallback while loading)
      const heartGap = 32, heartH = 28;
      const heartW = heartH; // square frame assets
      const heartY = (50 - heartH) / 2;
      for (let i = 0; i < 5; i++) {
        const hx = 20 + i * heartGap;
        const full = i < hp;
        const img = full ? heartLifeImg : heartLostImg;
        if (img.complete && img.width > 0) {
          if (!full) ctx.filter = 'grayscale(1)';
          ctx.drawImage(img, hx, heartY, heartW, heartH);
          ctx.filter = 'none';
        } else {
          ctx.font = '22px serif';
          ctx.fillStyle = full ? '#FF5252' : '#8b949e';
          ctx.textAlign = 'left';
          ctx.fillText('❤', hx, 32);
        }
      }

      // Wave
      ctx.font = 'bold 18px "Segoe UI"';
      ctx.fillStyle = '#79B8FF';
      ctx.textAlign = 'center';
      ctx.fillText(`WAVE  ${wave} / ${MAX_WAVES}`, W / 2, 32);

      // Score
      ctx.fillStyle = '#7EE787';
      ctx.textAlign = 'right';
      ctx.fillText(`SCORE  ${score}`, W - 20, 32);
    }

    // ── Overlays ──────────────────────────────────────────────────
    function drawOverlay(title, sub, btnText) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';

      if (phase === 'START') {
        ctx.fillStyle = '#7EE787';
        ctx.font = 'bold 64px "Segoe UI"';
        ctx.fillText(title, W / 2, H / 2 - 100);

        ctx.fillStyle = '#e6edf3';
        ctx.font = 'bold 24px "Segoe UI"';
        ctx.fillText("HOW TO PLAY", W / 2, H / 2 - 30);

        ctx.fillStyle = '#8b949e';
        ctx.font = '20px "Segoe UI"';
        ctx.fillText("⌨️ Type the answer and press ENTER to shoot", W / 2, H / 2 + 15);
        ctx.fillText("🎯 Click a zombie or use ↑ ↓ to change target", W / 2, H / 2 + 45);
        ctx.fillText("🛡️ Defend the castle for 8 waves!", W / 2, H / 2 + 75);

        ctx.fillStyle = '#238636';
        roundRect(W / 2 - 110, H / 2 + 130, 220, 50, 8); ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = 'bold 20px "Segoe UI"';
        ctx.fillText(btnText, W / 2, H / 2 + 162);
      } else {
        ctx.fillStyle = '#7EE787';
        ctx.font = 'bold 56px "Segoe UI"';
        ctx.fillText(title, W / 2, H / 2 - 40);
        ctx.fillStyle = '#ccc';
        ctx.font = '22px "Segoe UI"';
        ctx.fillText(sub, W / 2, H / 2 + 20);
        ctx.fillStyle = '#238636';
        roundRect(W / 2 - 90, H / 2 + 60, 180, 46, 8); ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = 'bold 18px "Segoe UI"';
        ctx.fillText(btnText, W / 2, H / 2 + 88);
      }
    }

    // ── Input Handling ────────────────────────────────────────────
    function triggerFeedback(col) {
      archerFeedback = 400; // ms
      archerFeedbackColor = col;
    }

    window.addEventListener('keydown', e => {
      if (phase !== 'PLAY') return;

      // Number input
      if (/^[0-9]$/.test(e.key)) {
        if (currentInput.length < 5) currentInput += e.key;
      }
      // Backspace
      else if (e.key === 'Backspace') {
        currentInput = currentInput.slice(0, -1);
      }
      // Shoot
      else if (e.key === 'Enter') {
        if (currentInput === '') return;
        const val = parseInt(currentInput, 10);

        if (currentTarget && !currentTarget.dying && currentTarget.ans === val) {
          // Hit!
          arrows.push(new Arrow(currentTarget));
          triggerFeedback('#A5D6A7'); // Green flash
          addMsg(`+${10 + wave * 2}`, currentTarget.x, currentTarget.y - 70, '#7EE787');
          currentInput = '';
        } else {
          // Miss
          triggerFeedback('#EF9A9A'); // Red flash
          addMsg('MISS!', TOWER_X, TOWER_Y - 120, '#FF5252');
          currentInput = '';
        }
      }
      // Manual Targeting (Up / Down lanes)
      else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        if (!currentTarget) return;
        let currLane = currentTarget.lane;
        let nextLane = e.key === 'ArrowUp' ? currLane - 1 : currLane + 1;
        if (nextLane < 0) nextLane = 3;
        if (nextLane > 3) nextLane = 0;

        // Find closest alive zombie in next lane
        let closest = null;
        for (const z of zombies) {
          if (z.alive && !z.dying && z.lane === nextLane) {
            if (!closest || z.x > closest.x) closest = z;
          }
        }
        if (closest) manualTarget = closest;
      }
    });

    // Click Targeting / Restart
    c.addEventListener('click', e => {
      if (phase === 'START' || phase === 'GAMEOVER' || phase === 'WIN') {
        wave = 1; score = 0; hp = 5; startWave();
        return;
      }

      if (phase === 'PLAY') {
        const rect = c.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Check if clicked near a zombie
        for (const z of zombies) {
          if (z.alive && !z.dying) {
            const dx = z.x - x;
            const dy = z.y - y;
            if (Math.sqrt(dx * dx + dy * dy) < 40) {
              manualTarget = z;
              break;
            }
          }
        }
      }
    });

    // ── Main logic loop ───────────────────────────────────────────
    function update(ts) {
      const dt = lastTs ? Math.min(ts - lastTs, 50) : 16;
      lastTs = ts;

      if (phase === 'PLAY') {
        // Spawning
        if (spawnQueue.length > 0) {
          spawnTimer += dt;
          if (spawnTimer >= SPAWN_INTERVAL) {
            spawnTimer = 0;
            zombies.push(new Zombie(spawnQueue.shift()));
          }
        }

        // Determine current target
        if (manualTarget && (!manualTarget.alive || manualTarget.dying)) {
          manualTarget = null;
        }

        if (manualTarget) {
          currentTarget = manualTarget;
        } else {
          // Auto target closest
          let closest = null;
          for (const z of zombies) {
            if (z.alive && !z.dying) {
              if (!closest || z.x > closest.x) closest = z;
            }
          }
          currentTarget = closest;
        }

        // Update zombies
        for (const z of zombies) {
          z.update(dt);
          if (!z.dying && z.alive && z.reachedCastle()) {
            z.startDying();
            hp--;
            addMsg('-1 ❤', CASTLE_X - 40, LANE_YS[z.lane], '#FF5252');
            if (hp <= 0) { hp = 0; phase = 'GAMEOVER'; }
          }
        }

        for (const a of arrows) a.update(dt);
        arrows = arrows.filter(a => !a.done);

        for (const p of particles) {
          p.x += p.vx * (dt / 16); p.y += p.vy * (dt / 16); p.vy += 0.18 * (dt / 16); p.life -= p.decay * (dt / 16);
        }
        particles = particles.filter(p => p.life > 0);

        for (const m of msgs) { m.y += m.vy * (dt / 16); m.life -= 0.018 * (dt / 16); }
        msgs = msgs.filter(m => m.life > 0);

        if (archerFeedback > 0) archerFeedback -= dt;

        // Wave Check
        const allSpawned = spawnQueue.length === 0;
        const allDead = zombies.every(z => !z.alive || z.dying);
        if (allSpawned && allDead && zombies.length > 0) {
          phase = 'WAVE_CLEAR'; waveEndTimer = 2000;
        }
      }
      else if (phase === 'WAVE_CLEAR') {
        waveEndTimer -= dt;
        if (waveEndTimer <= 0) {
          wave++;
          if (wave > MAX_WAVES) phase = 'WIN'; else startWave();
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();

      if (phase === 'PLAY' || phase === 'WAVE_CLEAR') {
        // Sort so lower Y is drawn later (pseudo 3D)
        const aliveZombies = zombies.filter(z => z.alive);
        aliveZombies.sort((a, b) => a.y - b.y);

        for (const z of aliveZombies) {
          z.draw(z === currentTarget);
        }

        drawCastle();

        for (const a of arrows) a.draw();
        for (const p of particles) {
          ctx.globalAlpha = p.life; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
        }
        for (const m of msgs) {
          ctx.globalAlpha = m.life; ctx.fillStyle = m.col; ctx.font = 'bold 18px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText(m.text, m.x, m.y); ctx.globalAlpha = 1;
        }
      } else {
        drawCastle();
      }

      drawHUD();

      if (phase === 'START') drawOverlay('🧟 ZOMBIE MATH', 'Type answer & press Enter to shoot!', 'CLICK TO START');
      if (phase === 'GAMEOVER') drawOverlay('💀 GAME OVER', `Score: ${score}  |  You reached Wave ${wave}`, 'CLICK TO RETRY');
      if (phase === 'WIN') drawOverlay('🏆 YOU WIN!', `Final Score: ${score}  —  All waves cleared!`, 'CLICK TO PLAY AGAIN');
      if (phase === 'WAVE_CLEAR') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center'; ctx.fillStyle = '#FFC107'; ctx.font = 'bold 48px "Segoe UI"'; ctx.fillText(`Wave ${wave} Complete!`, W / 2, H / 2);
      }
    }

    function loop(ts) { update(ts); render(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);

    // Focus canvas so key events register properly without clicking elsewhere
    c.focus();
  </script>
</body>

</html>
